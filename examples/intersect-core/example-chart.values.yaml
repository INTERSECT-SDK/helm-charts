# This is an example file you can use as a template for a prototype environment.
#
# Things you may want to modify
# - Any part of the chart can be enabled/disabled as needed.
# - Authentication credentials. Any variable leading with a * is defined under .anchors - otherwise it's safe to change.
# - System resources. This file has sane defaults but you may want to tweak these. Note that RabbitMQ and MinIO have minimum runtime requirements. 
#     More information: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
#
# NOTE: This setup focuses on utilizing a NodePort configuration for ALL Kubernetes Services, but this is not necessarily "production ready".
# Consider taking some of the approaches below:
# 1) Have services talk to each other via ClusterIP instead of NodePorts.
# 2) Do not expose the RabbitMQ message broker externally, only a proxy-http-server instance. Note that this only works if you are deploying all of your microservices on the Kubernetes cluster.
# 3) You may not want to expose things such as the RabbitMQ management UI or the MINIO console UI externally, and require admins to use "kubectl port-forward" to access these services.
# 4) Configure an ingress to expose only necessary components (assuming that all necessary components can communicate over HTTP).


######################
#### ANCHORS #########
######################
# anchors are just a useful feature so you don't repeat yourself in the config file
# the anchors are meant to be comprehensive for application-specific configuration, but will not touch on a Kubernetes-specific configuration.
# this is meant to represent a NodePort setup

.anchors:

  proxy:
    # this should currently be represented as "organization.facility.system", with the "." character representing namespace separations
    systemName: &proxy-systemName "org.fac.system."
    log_level: &proxy-loglevel "info"  # set to "debug" if you want extremely verbose output, including of the messages themselves

    server:
      serverUsername: &proxy-serverUsername "proxy_username"
      serverPasswordSecretName: &proxy-serverPassword-secretName "proxy-password-secret-name"
      serverPasswordSecretKey: &proxy-serverPassword-secretKey "proxy-password-secret-key"
      serverContainerPort: &proxy-serverPort 9071 # you do not have to set this value, it will be 8080 if you don't. This is mostly to avoid conflicts with other applications.
      nodePort: &proxy-serverNodePort 30030

    client:
      otherProxyUrl: &proxy-otherUrl "https://example.com/http-server-proxy" # base URL of the proxy service, up to but excluding the path
      otherProxyUsername: &proxy-otherUsername "proxy_not_on_this_cluster_username"
      otherProxyPasswordSecretName: &proxy-otherPassword-secretName "other-proxy-secret-name"
      otherProxyPasswordSecretKey: &proxy-otherPassword-secretKey "other-proxy-secret-key"

  # message plane
  messageBroker:
    kubeName: &messageBroker-kubeName "intersect-message-broker" # this is used both for inter-service communication, and to access the broker secret name
    username: &messageBroker-username "control"
    secretKey: &messageBroker-secretKey "rabbitmq-password" # this should not change unless you use a custom secret for the broker password
    #password: &messageBroker-password "ZTQ0YjljYTk0MTBj" # this is if you use a hard-coded password
    internalHost: &messageBroker-internalHost "intersect-message-broker" # this is the host that other applications in the cluster should use to talk to the message broker. It matches "kubeName" above, because this example sets "fullnameOverride" on the broker. If you remove that override, this becomes "<release>-intersect-message-broker-1", where "release" comes from the helm upgrade [RELEASE] value and "intersect-message-broker-1" comes from the chart name.
    amqpNodePort: &messageBroker-amqpNodePort 30010
    mqttNodePort: &messageBroker-mqttNodePort 30011
    #stompNodePort: &messageBroker-stompNodePort 30012
    managerNodePort: &messageBroker-managerNodePort 30013
    metricsNodePort: &messageBroker-metricsNodePort 30014
    distNodePort: &messageBroker-distNodePort 30015
    epmdNodePort: &messageBroker-epmdNodePort 30016

  # data plane
  minio:
    username: &minio-username "data"
    password: &minio-password "data_password"
    nodePort: &minio-nodePort 30020
    consoleNodePort: &minio-consoleNodePort 30021
  
  # identity provider
  keycloak:
    username: &keycloak-username "keycloak_user"
    password: &keycloak-password "keycloak_password"
    nodePort: &keycloak-nodePort 30030

  campaignOrchestrator:
    apiKey: &campaignOrchestrator-apiKey "01234567890123456789012345678901"
    apiKeySecretName: &campaignOrchestrator-apiKey-secretName "campaign-orchestrator-api-key"
    apiKeySecretKey: &campaignOrchestrator-apiKey-secretKey "api-key"

  registryService:
    systemName: &registryService-systemName "intersect-registry-system" # must match "^[a-z0-9][-a-z0-9]{2,62}$"
    nodePort: &registryService-nodePort 30040

    # the registry service does NOT deploy a broker or Keycloak, it talks to the ones deployed above.
    # YAML anchors cannot be concatenated, so the full URLs below repeat the hosts defined in this file -
    # keep them in sync with *messageBroker-internalHost and the keycloak service.
    brokerManagementUri: &registryService-brokerManagementUri "http://intersect-message-broker:15672/"
    # this URL is followed by the END USER'S BROWSER during the OIDC login redirect, so it must be
    # reachable from outside the cluster (here, the keycloak NodePort above).
    keycloakRealmBaseUrl: &registryService-keycloakRealmBaseUrl "http://localhost:30030/realms/intersect/protocol/openid-connect"
    keycloakClientId: &registryService-keycloakClientId "registry-service"

    # the least-privileged broker user the registry service creates and hands out to SDK clients.
    # this is NOT the broker root user above.
    brokerClientUsername: &registryService-brokerClientUsername "lackey"

    # registry service internal secret, must be at least 16 characters
    internalSecret: &registryService-internalSecret "0123456789abcdef"
    internalSecretSecretName: &registryService-internalSecret-secretName "intersect-shared-secrets"
    internalSecretSecretKey: &registryService-internalSecret-secretKey "REGISTRY_SECRET_NAME"

    # session cookie signing key, use a random 32 or 64 character string
    sessionSecret: &registryService-sessionSecret "01020304050607080910111213141516"
    sessionSecretSecretName: &registryService-sessionSecret-secretName "intersect-shared-secrets"
    sessionSecretSecretKey: &registryService-sessionSecret-secretKey "SESSION_SECRET"

    keycloakClientSecret: &registryService-keycloakClientSecret "oOwbABbnGEwRlXU3HzCgspBtWfwIiIfQ"
    keycloakClientSecretSecretName: &registryService-keycloakClientSecret-secretName "intersect-shared-secrets"
    keycloakClientSecretSecretKey: &registryService-keycloakClientSecret-secretKey "KEYCLOAK_CLIENT_SECRET"

    brokerClientPassword: &registryService-brokerClientPassword "lackey_password"
    brokerClientPasswordSecretName: &registryService-brokerClientPassword-secretName "intersect-shared-secrets"
    brokerClientPasswordSecretKey: &registryService-brokerClientPassword-secretKey "BROKER_CLIENT_PASSWORD"

    brokerClientApiKey: &registryService-brokerClientApiKey "registry_client_api_key"
    brokerClientApiKeySecretName: &registryService-brokerClientApiKey-secretName "intersect-shared-secrets"
    brokerClientApiKeySecretKey: &registryService-brokerClientApiKey-secretKey "BROKER_CLIENT_API_KEY"

    postgresUsername: &registryService-postgresUsername "registry_username"
    postgresDatabase: &registryService-postgresDatabase "registry"
    postgresPassword: &registryService-postgresPassword "registry_password"
    postgresPasswordSecretName: &registryService-postgresPassword-secretName "intersect-shared-secrets"
    postgresPasswordSecretKey: &registryService-postgresPassword-secretKey "POSTGRESQL_PASSWORD"


###################################
##### UI/MICROSERVICE SUBCHARTS ###
###################################

campaign-orchestrator:
  # set this to "true" when you want the campaign orchestrator included in the umbrella release
  enabled: true
  app:
    apiKey:
      # Option 1: switch to secret-backed credentials
      isSecret: true
      secretName: *campaignOrchestrator-apiKey-secretName
      secretKey: *campaignOrchestrator-apiKey-secretKey

      # Option 2: use a hardcoded key for simple local installs
      #isSecret: false
      #hardcoded: *campaignOrchestrator-apiKey

  broker:
    host: *messageBroker-internalHost
    protocol: "amqp0.9.1"
    username: *messageBroker-username
    password:
      # Option 1: switch to secret-backed credentials
      isSecret: true
      secretName: *messageBroker-kubeName
      secretKey: *messageBroker-secretKey

      # Option 2: use the broker password from the umbrella chart
      #isSecret: false
      #hardcoded: *messageBroker-password

  campaignRepository:
    backend: memory

registry-service:
  # set this to "true" when you want the registry service included in the umbrella release
  enabled: true

  app:
    systemName: *registryService-systemName
    secretName:
      # Option 1: switch to secret-backed credentials
      isSecret: true
      secretName: *registryService-internalSecret-secretName
      secretKey: *registryService-internalSecret-secretKey

      # Option 2: use a hardcoded secret for simple local installs
      #isSecret: false
      #hardcoded: *registryService-internalSecret

    # DEVELOPMENT_API_KEY disables broker ACLs and API key checks ENTIRELY.
    # Leave this unset on any deployment reachable outside your control.
    #developmentApiKey:
    #  isSecret: false
    #  hardcoded: "dev-api-key"

  auth:
    # "rudimentary" uses hardcoded in-memory users and is for local development ONLY
    implementation: keycloak
    keycloak:
      realmBaseUrl: *registryService-keycloakRealmBaseUrl
      scope: "openid email"
      clientId: *registryService-keycloakClientId
      # register this client in keycloak with redirect URIs ${BASE_URL}, ${BASE_URL}/login and ${BASE_URL}/login/callback
      clientSecret:
        isSecret: true
        secretName: *registryService-keycloakClientSecret-secretName
        secretKey: *registryService-keycloakClientSecret-secretKey

        #isSecret: false
        #hardcoded: *registryService-keycloakClientSecret
    session:
      secret:
        isSecret: true
        secretName: *registryService-sessionSecret-secretName
        secretKey: *registryService-sessionSecret-secretKey

        #isSecret: false
        #hardcoded: *registryService-sessionSecret

  broker:
    host: *messageBroker-internalHost
    port: 5672
    protocol: "amqp0.9.1"
    application: rabbitmq
    managementUri: *registryService-brokerManagementUri
    # the broker admin user - the registry service uses this to declare the INTERSECT exchange
    # and to create the least-privileged "client" user below
    root:
      username: *messageBroker-username
      password:
        isSecret: true
        secretName: *messageBroker-kubeName
        secretKey: *messageBroker-secretKey

        # Option 2: use the broker password from the umbrella chart
        #isSecret: false
        #hardcoded: *messageBroker-password
    client:
      username: *registryService-brokerClientUsername
      password:
        isSecret: true
        secretName: *registryService-brokerClientPassword-secretName
        secretKey: *registryService-brokerClientPassword-secretKey

        #isSecret: false
        #hardcoded: *registryService-brokerClientPassword
      apiKey:
        isSecret: true
        secretName: *registryService-brokerClientApiKey-secretName
        secretKey: *registryService-brokerClientApiKey-secretKey

        #isSecret: false
        #hardcoded: *registryService-brokerClientApiKey

  # this example will use a NodePort service
  service:
    type: NodePort
    nodePort: *registryService-nodePort

  # the registry service deploys its own PostgreSQL StatefulSet, this is NOT the keycloak database
  postgresql:
    enabled: true
    auth:
      username: *registryService-postgresUsername
      database: *registryService-postgresDatabase
      password:
        isSecret: true
        secretName: *registryService-postgresPassword-secretName
        secretKey: *registryService-postgresPassword-secretKey

        #isSecret: false
        #hardcoded: *registryService-postgresPassword
    # set this to "true" (and set a storageClass) if you want the registry database to survive a pod restart
    persistence:
      enabled: false

#######################
### PROXY SUBCHARTS ###
#######################
proxy-http-server:
  # set this to "true" if you want to use the application. The rest of this configuration assumes you set this to "true"
  enabled: false
  service:
    type: NodePort
    port: *proxy-serverPort
    nodePort: *proxy-serverNodePort
  # you do not have to set this value, it will be 8080 if you don't.
  containerPort: *proxy-serverPort
  app:
    topic_prefix: *proxy-systemName
    log_level: *proxy-loglevel
    broker:
      host: *messageBroker-internalHost
      username: *messageBroker-username
      password:
        isSecret: true
        secretName: *messageBroker-kubeName
        secretKey: *messageBroker-secretKey
    username: *proxy-serverUsername
    password:
      isSecret: true
      # if "isSecret = false", then set the "hardcoded" string and do not set secretName or secretKey
      hardcoded: ""
      secretName: *proxy-serverPassword-secretName
      secretKey: *proxy-serverPassword-secretKey


proxy-http-client:
  # set this to "true" if you want to use the application. The rest of this configuration assumes you set this to "true"
  enabled: false
  app:
    topic_prefix: *proxy-systemName
    log_level: *proxy-loglevel
    broker:
      host: *messageBroker-internalHost
      username: *messageBroker-username
      password:
        isSecret: true
        secretName: *messageBroker-kubeName
        secretKey: *messageBroker-secretKey
    other_proxy:
      url: *proxy-otherUrl
      username: *proxy-otherUsername
      password:
        isSecret: true
        # if "isSecret = false", then set the "hardcoded" string and do not set secretName or secretKey
        hardcoded: ""
        secretName: *proxy-otherPassword-secretName
        secretKey: *proxy-otherPassword-secretKey

################################
### MESSAGE BROKER SUBCHARTS ###
################################

# you can tweak authentication + hardware resources if you want, don't disable these

intersect-message-broker-1:
  # note that while using "fullnameOverride" is generally fine for single deployments per-cluster, it can cause problems if you are deploying multiple instances of intersect-core on one cluster
  # consider using "nameOverride" or manually setting values modified by this anchor if you want to change this
  fullnameOverride: *messageBroker-kubeName
  auth:
    username: *messageBroker-username
    # you may find it easier to create your own Secret instead of using the Secret generated by the Bitnami chart
    # in this case, use .Values.auth.existingPasswordSecret or .Values.auth.existingErlangSecret
    password: ZTQ0YjljYTk0MTBj
    erlangCookie: MTliNGQxYzI2YTA4
  # this example will use a NodePort service
  service:
    type: NodePort
    nodePorts:
      amqp: *messageBroker-amqpNodePort
      dist: *messageBroker-distNodePort
      manager: *messageBroker-managerNodePort
      epmd: *messageBroker-epmdNodePort
      metrics: *messageBroker-metricsNodePort
    extraPorts:
      - name: mqtt
        port: 1883
        targetPort: 1883
        nodePort: *messageBroker-mqttNodePort
      #- name: stomp
      #  port: 61613
      #  targetPort: 61613
      #  nodePort: *messageBroker-stompNodePort    
  resources:
    requests:
      memory: "2Gi"
      # cpu: "8"
      # ephemeral-storage: "2Gi"
    limits:
      # NOTE: the default RabbitMQ chart REQUIRES you to set the "memory" value EVEN IF .Values.intersect-message-broker-1.memoryHighWatermark.type is "absolute"
      # this got fixed on a later version of the RabbitMQ chart than what we're using: https://github.com/bitnami/charts/commit/b92af12ad55e92c8b1377987b222090787d23b02
      memory: "4Gi"
      # cpu: "16"
      # ephemeral-storage: "4Gi"

############################
### DATA PLANE SUBCHARTS ###
############################

# you can tweak authentication + hardware resources if you want, don't disable these

intersect-storage-1:
  auth:
    rootUser: *minio-username
    rootPassword: *minio-password
  # this example will use a NodePort service
  service:
    type: NodePort
    nodePorts:    
      api: *minio-nodePort
      console: *minio-consoleNodePort
  resources:
    requests:
      # memory: "64Mi"
      # cpu: "8"
      ephemeral-storage: "2Gi"
    limits:
      # memory: "128Mi"
      # cpu: "16"
      ephemeral-storage: "4Gi"

####################################################
### IDENTITY PROVIDER / AUTHENTICATION SUBCHARTS ###
####################################################
# Configure identity provider

intersect-authentication-1:
  auth:
    adminUser: *keycloak-username
    adminPassword: *keycloak-password

  # this example will use a NodePort service
  service:
    type: NodePort
    nodePorts:    
      http: *keycloak-nodePort
